services:
  - type: web
    name: vibewear-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false        # You'll paste this in the Render dashboard
      - key: PORT
        value: 4000
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false        # Add your Netlify URL here after deploying frontend
      - key: GMAIL_USER
        sync: false        # Gmail address used to send appointment request emails
      - key: GMAIL_APP_PASSWORD
        sync: false        # 16-char Gmail App Password (requires 2-Step Verification on the account)
      - key: COMPANY_EMAIL
        sync: false        # Optional — inbox that receives requests. Defaults to GMAIL_USER if unset
      - key: PAYSTACK_SECRET_KEY
        sync: false        # Your Paystack SECRET key (starts with sk_test_ or sk_live_) — used server-side only
